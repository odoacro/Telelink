plugins { id 'com.android.application' }

android {
    namespace 'app.telelink'
    compileSdk 34

    defaultConfig {
        applicationId 'app.telelink'
        minSdk 24
        targetSdk 34
        versionCode((System.getenv('BUILD_NUMBER') ?: '1').toInteger())
        versionName '1.0.' + (System.getenv('BUILD_NUMBER') ?: '0')
    }

    // Clave fija en el repo para que cada APK nuevo se instale encima del anterior.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Solo para quitar la cabecera X-Requested-With que delata a la app ante las webs.
    implementation 'androidx.webkit:webkit:1.11.0'
}
