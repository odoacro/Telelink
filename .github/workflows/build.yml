name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Empieza en 1000 para quedar por encima de las versiones de Cimentacion/Telelink;
      # así el APK se instala encima de una instalada desde allí.

      - name: Numerar la versión
        run: echo "BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 1000))" >> "$GITHUB_ENV"

      - name: Compilar
        run: gradle assembleDebug --no-daemon

      - name: Renombrar
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TeleLink.apk
          echo "${BUILD_NUMBER}" > version.txt

      - uses: actions/upload-artifact@v4
        with:
          name: TeleLink
          path: TeleLink.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: TeleLink (última compilación)
          files: |
            TeleLink.apk
            version.txt
          make_latest: true
